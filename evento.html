<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agregar al calendario · Flights</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--muted:#8A8A8F;--accent:#0A84FF;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#fff;--muted:#8E8E93}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.ic{width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.ic svg{width:30px;height:30px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:15px}
.btn{display:block;margin:20px 0 0;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;text-decoration:none}
.alt{display:block;margin-top:12px;color:var(--accent);font-size:15px;text-decoration:none}
.err{color:#D70015}
</style>
</head>
<body>
<div class="card">
  <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M12 13v4M10 15h4"/></svg></div>
  <h1 id="t">Agregar al calendario</h1>
  <p id="s"></p>
  <a class="btn" id="go" href="#">Agregar al calendario</a>
  <a class="alt" id="dl" href="#" download="vuelo.ics">Descargar el archivo del evento</a>
</div>
<script>
/* The event travels only in the part of the address after "#", which the browser never sends to any server. */
(function () {
  try {
    const b64 = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ev = JSON.parse(new TextDecoder().decode(bytes));
    document.getElementById("t").textContent = ev.title || "Agregar al calendario";
    document.getElementById("s").textContent = ev.sub || "";
    const data = "data:text/calendar;charset=utf-8," + encodeURIComponent(ev.ics);
    const go = document.getElementById("go"); go.href = data;
    const dl = document.getElementById("dl"); dl.download = ev.file || "vuelo.ics";
    dl.href = URL.createObjectURL(new Blob([ev.ics], { type:"text/calendar" }));
    setTimeout(() => { location.href = data; }, 250);      // Safari opens its "Add to Calendar" window
  } catch (e) {
    document.getElementById("s").innerHTML = '<span class="err">No se pudo leer el evento. Volvé a Flights y tocá Calendario otra vez.</span>';
    document.getElementById("go").style.display = "none"; document.getElementById("dl").style.display = "none";
  }
})();
</script>
</body>
</html>
